<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Currency Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Global Currency Converter</h1>

        <!-- Selection Controls Area -->
        <div class="search-box">
            <!-- Amount Input -->
            <label for="amountInput">Amount:</label>
            <input type="number" id="amountInput" value="1" min="0" placeholder="Enter amount...">

            <!-- Base Currency Selection -->
            <label for="baseCurrencySelect">From:</label>
            <select id="baseCurrencySelect">
                <option value="USD" selected>US Dollar (USD)</option>
                <option value="INR">Indian Rupee (INR)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">British Pound (GBP)</option>
                <option value="JPY">Japanese Yen (JPY)</option>
                <option value="AUD">Australian Dollar (AUD)</option>
                <option value="CAD">Canadian Dollar (CAD)</option>
            </select>

            <!-- Target Currency Selection -->
            <label for="targetCurrencySelect">To:</label>
            <select id="targetCurrencySelect">
                <option value="INR" selected>Indian Rupee (INR)</option>
                <option value="USD">US Dollar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">British Pound (GBP)</option>
                <option value="JPY">Japanese Yen (JPY)</option>
                <option value="AUD">Australian Dollar (AUD)</option>
                <option value="CAD">Canadian Dollar (CAD)</option>
            </select>
        </div>

        <button id="refresh-btn">Convert Currency</button>

        <!-- Dynamic Data Cards -->
        <div class="cards-container">
            <!-- Card 1: Main Converted Result -->
            <div class="card">
                <h3>Converted Result</h3>
                <div id="rate-display">--</div>
            </div>

            <!-- Card 2: Inverse Baseline (Vice Versa) -->
            <div class="card">
                <h3>Inverse Value</h3>
                <div id="inverse-display">--</div>
            </div>
        </div>

        <!-- Status Notification Banner -->
        <div id="status-msg">Enter an amount and click convert.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
